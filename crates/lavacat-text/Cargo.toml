[package]
name = "lavacat-text"
description = "LavaCat 文本整形与字体 facade"
version = "0.1.10"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# 默认开启全部已实现能力；下游（lavacat-layout / lavacat-paint / lavacat-chrome）
# 依赖默认即可获得整形 + 字体解析。
default = ["shaping", "font-resolution"]
# 单行文本整形：TextShaper trait 与 parley（fontique + harfrust）实现。
# ParleyTextShaper 的字体解析复用 FontResolver，故隐含 font-resolution。
shaping = ["dep:parley", "font-resolution"]
# 字体文件解析：FontResolver / ResolvedFont 与 @font-face 注册表
# （FontRegistry / FontFaceDescriptor），供 paint 取字体字节、chrome 注册
# Web 字体。
font-resolution = ["dep:parley", "dep:skrifa"]

[dependencies]
# parley 内部经 fontique 选字、harfrust 整形；swash 自 parley 0.11 起不再参与
parley = { version = "0.11.1", optional = true }

# Already present transitively via parley; used for exact outline bounds so
# offscreen glyphs can be culled without guessing from font-size/advance.
skrifa = { version = "0.44.0", optional = true }
