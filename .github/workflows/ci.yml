name: CI

# 持续集成：推送到任意分支或开 PR 到 main 时，对全部 workspace 跑格式 / 静态检查 /
# 测试 / 安全门禁（cargo-deny、cargo-about）与 MSRV 校验。
# Linux / macOS / Windows 每次推送或 PR 都执行，滚动测试使用显式行高。

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------- 代码格式（rustfmt）----------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ---------- 静态检查（clippy，零告警）----------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (winit / wgpu link deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libtss2-dev libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libdbus-1-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libfontconfig1-dev \
            vulkan-tools libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------- 测试（三平台，每次必跑）----------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libtss2-dev libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libdbus-1-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libfontconfig1-dev \
            vulkan-tools libvulkan-dev \
            fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: JsRunner native IPC process tests
        run: cargo test -p lavacat-jsrunner --features process-tests --test process

  # ---------- 依赖安全 / 许可证门禁（cargo-deny）----------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # ---------- 第三方依赖许可证清单（cargo-about）----------
  about:
    name: cargo-about
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate license texts and attribution notes
        run: |
          cargo about generate --format json -o /tmp/lavacat-about.json
          cargo about generate about.hbs -o docs/dependencies.html
          python tools/licenses/inject-notes.py /tmp/lavacat-about.json docs/dependencies.html
      - uses: actions/upload-artifact@v4
        with:
          name: dependencies-report
          path: docs/dependencies.html
          if-no-files-found: error

  # ---------- 最低支持版本校验（MSRV = workspace rust-version）----------
  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libtss2-dev libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libdbus-1-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libfontconfig1-dev \
            vulkan-tools libvulkan-dev
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
